{{ define "main" }}
  {{ partial "section-info" . }}

  <section class="section">
    {{ range .RegularPages.ByWeight }}
      <article>
        <h2 class="title is-3 has-text-centered">{{ .Title }}</h2>
        <div class="content">{{ .Content }}</div>
      </article>
    {{ end }}
  </section>
{{ end }}
